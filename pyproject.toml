[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikijs-mcp"
version = "0.1.0"
description = "MCP server for Wiki.js v2"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
wikijs-mcp = "wikijs_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wikijs_mcp"]
